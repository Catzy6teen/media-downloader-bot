# /etc/nginx/sites-available/tg-torrent-bot
# Symlink to /etc/nginx/sites-enabled/ after editing.
#
# Replace YOUR_DOMAIN with your actual domain or server IP.
# Replace the SSL certificate paths with your Let's Encrypt paths.

server {
    listen 80;
    server_name YOUR_DOMAIN;
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── TLS (Let's Encrypt / Certbot) ────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ─────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         DENY;
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         "no-referrer";

    # ── Large file upload support ─────────────────────────────────────────
    client_max_body_size 60g;
    proxy_request_buffering off;          # stream body directly to upstream
    proxy_read_timeout      3600s;        # 1 hour for large uploads
    proxy_send_timeout      3600s;
    proxy_connect_timeout   60s;

    # ── Upstream (FastAPI / Uvicorn) ──────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Health check (allow internal monitoring without rate limit) ───────
    location /health {
        proxy_pass         http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # ── Hide server tokens ────────────────────────────────────────────────
    server_tokens off;
}
